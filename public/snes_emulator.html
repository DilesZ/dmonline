<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retro Hub · SNES</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b0514; color: #e8dff5;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; overflow: hidden; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 16px;
    background: linear-gradient(180deg, #1a0f2e, #120a20);
    border-bottom: 1px solid #3c096c;
    box-shadow: 0 2px 12px rgba(124, 58, 237, .25);
  }
  .topbar h1 {
    font-size: 15px; font-weight: 800; letter-spacing: 1.5px;
    color: #c4b5fd; text-transform: uppercase; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .topbar h1 .lz {
    background: linear-gradient(90deg, #a78bfa, #e879f9);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .topbar small { display: block; font-weight: 400; letter-spacing: .4px;
    color: #8b7bb8; text-transform: none; font-size: 11px; margin-top: 2px; }
  .btn {
    flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid #7c3aed; background: transparent; color: #c4b5fd;
    font-size: 13px; font-weight: 700; letter-spacing: .5px;
    transition: all .15s ease; text-decoration: none;
  }
  .btn:hover { background: #7c3aed; color: #fff; box-shadow: 0 0 14px rgba(124,58,237,.55); }
  #wrap { position: relative; width: 100%; height: calc(100% - 57px); }
  #game { width: 100%; height: 100%; }
  .error-box {
    display: none; margin: 60px auto; max-width: 520px; padding: 24px;
    border: 1px solid #ef4444; border-radius: 12px; background: #1f1216;
    color: #fca5a5; text-align: center; line-height: 1.6;
  }
</style>
</head>
<body>
  <div class="topbar">
    <h1>▸ JUEGOS<span class="lz">Z</span> <small id="romName">SNES · cargando…</small></h1>
    <a class="btn" href="/">⌂ Volver al hub</a>
  </div>

  <div id="wrap">
    <div class="error-box" id="err"></div>
    <div id="game"></div>
  </div>

<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var rom = params.get('rom');
    var name = params.get('name');
    var bios = params.get('bios');
    var biosextract = params.get('biosextract') === '1';

    // Núcleos disponibles en /data/cores (clave en minúsculas → valor canónico).
    var CORES = { snes: 'snes', arcade: 'arcade', segamd: 'segaMD', nes: 'nes', nds: 'nds' };
    var CORE_LABEL = { snes: 'SNES', arcade: 'ARCADE', segaMD: 'MEGA DRIVE', nes: 'NES', nds: 'NINTENDO DS' };
    var core = CORES[(params.get('core') || 'snes').toLowerCase()] || 'snes';

    if (!rom) {
      document.getElementById('game').style.display = 'none';
      var e = document.getElementById('err');
      e.style.display = 'block';
      e.innerHTML = '<strong>No se ha indicado ninguna ROM.</strong><br>' +
        'Vuelve al hub y elige un juego de la biblioteca.';
      return;
    }

    // Solo aceptamos http(s), blob: y rutas same-origin (/api/drive) — nunca data:.
    if (!/^(https:|blob:|\/)/i.test(rom)) {
      document.getElementById('game').style.display = 'none';
      var e2 = document.getElementById('err');
      e2.style.display = 'block';
      e2.innerHTML = '<strong>La URL de la ROM no es válida.</strong><br>' +
        'Vuelve al hub y abre el juego desde la biblioteca.';
      return;
    }

    if (name) {
      var label = CORE_LABEL[core] || core.toUpperCase();
      document.getElementById('romName').textContent =
        decodeURIComponent(name).replace(/\.[^.]+$/, '') + ' · ' + label;
      document.title = decodeURIComponent(name) + ' · JuegosZ';
    }

    window.EJS_player = '#game';
    window.EJS_core = core;
    window.EJS_gameUrl = rom;
    window.EJS_pathtodata = 'data/';
    window.EJS_startOnLoaded = true;
    window.EJS_backgroundColor = '#0b0514';

    // BIOS opcional vía proxy (p. ej. neogeo.zip para el núcleo arcade).
    // El nombre del fichero va en la ruta: el núcleo lo usa para identificar el BIOS.
    // Con biosextract=1 el servidor construye el neogeo.zip desde el propio juego.
    if (bios && /^[A-Za-z0-9_-]{10,}$/.test(bios)) {
      window.EJS_biosUrl = '/api/rom/neogeo.zip?id=' + bios + (biosextract ? '&extractbios=1' : '');
    }

    var s = document.createElement('script');
    s.src = 'data/loader.js';
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
